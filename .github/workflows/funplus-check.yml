name: FunPlus 每日签到

on:
  workflow_dispatch:
  schedule:
    # GitHub 使用 UTC。北京时间 08:20 / 22:20（错开整点高峰，一天两次防漏跑）
    - cron: "20 0 * * *"   # 北京 08:20
    - cron: "20 14 * * *"  # 北京 22:20
  watch:
    types: [started]

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run FunPlus check-in
        run: python main.py
        env:
          FUNPLUS_AUTH: ${{ secrets.FUNPLUS_AUTH }}
          FUNPLUS_STORAGE_STATE: ${{ secrets.FUNPLUS_STORAGE_STATE }}
          FUNPLUS_H5_AUTH: ${{ secrets.FUNPLUS_H5_AUTH }}
          FUNPLUS_COOKIE: ${{ secrets.FUNPLUS_COOKIE }}
          FUNPLUS_BASENAME: ${{ vars.FUNPLUS_BASENAME }}
          FUNPLUS_GAME_PROJECT: ${{ vars.FUNPLUS_GAME_PROJECT }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

      - name: Keep workflow active
        uses: liskin/gh-workflow-keepalive@v1
        continue-on-error: true
