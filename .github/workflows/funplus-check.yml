name: FunPlus 每日签到

on:
  workflow_dispatch:
  schedule:
    # GitHub 使用 UTC。游戏按 UTC 00:00（北京 08:00）刷新。
    # 两次运行都落在北京 08:00 前后 8 小时内（00:00–16:00），避免跨日误兑。
    - cron: "30 0 * * *"   # 北京 08:30（刷新后不久）
    - cron: "30 6 * * *"   # 北京 14:30（同日兜底，仍在窗口内）
  watch:
    types: [started]

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run FunPlus check-in
        run: python main.py
        env:
          FUNPLUS_AUTH: ${{ secrets.FUNPLUS_AUTH }}
          FUNPLUS_STORAGE_STATE: ${{ secrets.FUNPLUS_STORAGE_STATE }}
          FUNPLUS_H5_AUTH: ${{ secrets.FUNPLUS_H5_AUTH }}
          FUNPLUS_COOKIE: ${{ secrets.FUNPLUS_COOKIE }}
          FUNPLUS_BASENAME: ${{ vars.FUNPLUS_BASENAME }}
          FUNPLUS_GAME_PROJECT: ${{ vars.FUNPLUS_GAME_PROJECT }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

      - name: Keep workflow active
        uses: liskin/gh-workflow-keepalive@v1
        continue-on-error: true
